# golangci-lint v2 config. Run: golangci-lint run ./...
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errname
    - errorlint
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

formatters:
  enable:
    - gofmt
